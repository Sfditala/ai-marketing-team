ial, sans-serif" font-size="17" fill="#d0d0d0">Orchestrator</text><rect class="pulse" style="animation-delay:2.2s" x="570" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="600" cy="244" r="8" fill="#ef5a66"/><text x="600" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Agents</text><rect class="pulse" style="animation-delay:3.3s" x="810" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="840" cy="244" r="8" fill="#ffffff"/><text x="840" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Owner approves</text><rect class="pulse" style="animation-delay:4.4s" x="1050" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="1080" cy="244" r="8" fill="#ef5a66"/><text x="1080" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Saved</text><circle class="dot" r="8" fill="#ef5a66"/></svg>